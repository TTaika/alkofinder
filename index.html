const $status = document.getElementById('status');
const $distance = document.getElementById('distance');
const $store = document.getElementById('store');
const $arrow = document.getElementById('arrow');
const $permbtn = document.getElementById('permbtn');

let userLat = null, userLon = null;
let heading = 0;
let lastRot = 0;

const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;

function distMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p1 = toRad(lat1), p2 = toRad(lat2);
  const dp = toRad(lat2 - lat1);
  const dl = toRad(lon2 - lon1);
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function bearingDeg(lat1, lon1, lat2, lon2) {
  const p1 = toRad(lat1), p2 = toRad(lat2);
  const dl = toRad(lon2 - lon1);
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function findNearest() {
  let best = null, bestD = Infinity;
  for (const s of STORES) {
    const d = distMeters(userLat, userLon, s.lat, s.lon);
    if (d < bestD) { bestD = d; best = s; }
  }
  return { store: best, dist: bestD };
}

function formatDist(m) {
  if (m < 1000) return Math.round(m) + ' m';
  if (m < 10000) return (m/1000).toFixed(2) + ' km';
  return Math.round(m/1000) + ' km';
}

// Rotate arrow taking the shortest angular path (avoid 359→0 jump spin)
function setRotation(target) {
  let delta = ((target - lastRot) % 360 + 540) % 360 - 180;
  lastRot = lastRot + delta;
  $arrow.style.transform = `rotate(${lastRot}deg)`;
}

function render() {
  if (userLat == null) return;
  const { store, dist } = findNearest();
  const bearing = bearingDeg(userLat, userLon, store.lat, store.lon);
  $distance.textContent = formatDist(dist);
  $store.textContent = (store.n || 'Alko') + (store.c ? ' · ' + store.c : '');
  setRotation((bearing - heading + 360) % 360);
  $status.textContent = '';
}

function onPos(p) {
  userLat = p.coords.latitude;
  userLon = p.coords.longitude;
  render();
}
function onPosErr(e) {
  $status.textContent = 'Sijainti epäonnistui: ' + e.message;
}

function onOrient(e) {
  let h;
  if (typeof e.webkitCompassHeading === 'number') {
    h = e.webkitCompassHeading;
  } else if (typeof e.alpha === 'number') {
    h = (360 - e.alpha) % 360;
  } else {
    return;
  }
  heading = h;
  render();
}

function startCompass() {
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', onOrient, true);
        $permbtn.hidden = true;
      } else {
        $status.textContent = 'Kompassi-lupa evätty';
      }
    }).catch(() => { $status.textContent = 'Kompassia ei voitu käynnistää'; });
  } else {
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
    $permbtn.hidden = true;
  }
}

if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
  $permbtn.hidden = false;
  $permbtn.addEventListener('click', startCompass, { once: true });
} else {
  startCompass();
}

if (!navigator.geolocation) {
  $status.textContent = 'Selain ei tue paikannusta';
} else {
  navigator.geolocation.watchPosition(onPos, onPosErr, {
    enableHighAccuracy: true, maximumAge: 5000, timeout: 30000
  });
}
